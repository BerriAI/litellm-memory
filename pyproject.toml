[project]
name = "litemem"
version = "0.1.0"
description = "A Slack and web research agent grounded in shared product memories"
requires-python = ">=3.12"
dependencies = [
  "openai-agents>=0.3",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "httpx>=0.28",
  "pydantic-settings>=2.8",
  "itsdangerous>=2.2",
  "authlib>=1.5",
  "slack-sdk>=3.35",
  "aiosqlite>=0.21",
  "beautifulsoup4>=4.13",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
