# Render provisions the application and its encrypted Ente data store together.
# Museum runs privately beside the web process, managed by moegent.boot.
services:
  - type: web
    name: litemem
    runtime: docker
    dockerfilePath: ./Dockerfile.litemem
    dockerContext: .
    plan: standard
    region: oregon
    numInstances: 1
    autoDeployTrigger: off
    healthCheckPath: /health
    disk:
      name: litemem-state
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: STATE_DIR
        value: /data
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: litemem-ente
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_CODE
        generateValue: true
      - key: REGISTRATION_MODE
        value: domain
      - key: SHARING_ENABLED
        value: "false"
      - key: SEARCH_CACHE_MB
        value: "512"
databases:
  - name: litemem-ente
    plan: basic-256mb
    region: oregon
    databaseName: litemem
    user: litemem
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
