<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>litemem</title>
  <link rel="icon" href="/static/moegent-icon.jpg">
  <link rel="stylesheet" href="/static/style.css?v=3">
  <script type="module" src="/static/app.js?v=3"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="#chat" aria-label="litemem home"><img class="logo" src="/static/moegent-icon.jpg" alt="">litemem</a>
    <nav aria-label="Main navigation">
      <button id="chat-tab" class="nav-button active" aria-current="page">Chat</button>
      <button id="memories-tab" class="nav-button">Memories</button>
    </nav>
    <div class="header-actions">
      <button id="history-button" class="button quiet" aria-label="Conversation history">History</button>
      <button id="new-chat" class="button outline"><span aria-hidden="true">＋</span> New chat</button>
      <a id="login" class="button outline" href="/auth/slack" hidden>Sign in</a>
    </div>
  </header>
  <div id="connection" class="connection-banner" role="status" hidden></div>
  <main id="main" tabindex="-1">
    <section id="chat-view" class="chat-view empty" aria-label="Chat">
      <div id="welcome" class="welcome"><h1>Ask litemem</h1></div>
      <div id="messages" class="messages" role="log" aria-label="Conversation" aria-live="off"></div>
      <div class="composer-area">
        <div id="composer-error" class="inline-error" role="alert" hidden></div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="question">Message litemem</label>
          <textarea id="question" rows="1" maxlength="16000" placeholder="Ask about Moe’s memories…" autocomplete="off"></textarea>
          <div class="composer-bottom">
            <span id="composer-hint" class="keyboard-hint">Enter to send <span>·</span> Shift + Enter for a new line</span>
            <span id="character-count" class="keyboard-hint" hidden></span>
            <button id="stop" type="button" class="button outline" hidden><span class="stop-symbol" aria-hidden="true"></span> Stop</button>
            <button id="send" type="submit" class="button primary" disabled>Send <span aria-hidden="true">↑</span></button>
          </div>
        </form>
        <div id="suggestions" class="suggestions" aria-label="Suggested questions">
          <button data-question="What has Moe decided about litemem?">litemem decisions <span aria-hidden="true">↗</span></button>
          <button data-question="What changed in Moe’s memories in the last seven days?">Recent changes <span aria-hidden="true">↗</span></button>
          <button data-question="What has Moe learned about building agents?">Building agents <span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <button id="jump-bottom" class="button outline jump-bottom" hidden>Latest message ↓</button>
    </section>

    <section id="memories-view" class="memories-view" aria-labelledby="memories-title" hidden>
      <div class="page-title"><h1 id="memories-title">Memories</h1></div>
      <form id="search-form" role="search">
        <div class="search-box"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search-query" type="search" placeholder="Search memories" aria-label="Search memories" autocomplete="off"><kbd>/</kbd></div>
        <div class="search-toolbar">
          <label class="sr-only" for="search-mode">Search mode</label>
          <select id="search-mode" aria-label="Search mode"><option value="hybrid">Meaning + keywords</option><option value="semantic">Meaning</option><option value="fuzzy">Keywords</option></select>
          <button id="filters-toggle" type="button" class="button outline" aria-expanded="false" aria-controls="filters">Filters <span id="filter-count" hidden></span></button>
          <button id="clear-filters" type="button" class="button quiet" hidden>Clear filters</button>
          <label class="sr-only" for="sort">Sort memories</label>
          <select id="sort" class="sort" aria-label="Sort memories"><option value="relevance">Most relevant</option><option value="created_at:desc">Newest first</option><option value="created_at:asc">Oldest first</option><option value="updated_at:desc">Recently updated</option></select>
        </div>
        <div id="filters" class="filters" hidden>
          <label>Topic<input id="scope" placeholder="Any topic"></label>
          <label>Type<select id="kind"><option value="">All types</option><option value="decision">Decisions</option><option value="learning">Learnings</option><option value="correction">Corrections</option><option value="workflow">Workflows</option><option value="context">Context</option><option value="disagreement">Disagreements</option></select></label>
          <label>Created from<input id="created-from" type="date"></label>
          <label>Created through<input id="created-through" type="date"></label>
          <label class="check-label"><input id="archive" type="checkbox"> Include archived memories</label>
        </div>
      </form>
      <div id="search-feedback" role="status" class="search-feedback"></div>
      <div id="results" class="results" aria-busy="false"></div>
      <button id="load-more" class="button outline load-more" hidden>Load more</button>
    </section>
  </main>

  <dialog id="source-dialog" class="source-dialog" aria-labelledby="source-title">
    <div class="dialog-top"><span>Source</span><button id="close-source" class="icon-button" aria-label="Close source">×</button></div>
    <div id="source-body" class="source-body"></div>
    <div class="dialog-bottom"><button id="ask-source" class="button outline" hidden>Ask about this</button><button id="copy-source" class="button quiet" hidden>Copy link</button></div>
  </dialog>
  <dialog id="history-dialog" class="history-dialog" aria-labelledby="history-title">
    <div class="dialog-top"><h2 id="history-title">History</h2><button id="close-history" class="icon-button" aria-label="Close history">×</button></div>
    <div id="history-list" class="history-list"></div>
    <div id="account-actions" class="dialog-bottom" hidden><button id="logout" class="button quiet">Sign out of litemem</button></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
</body>
</html>
